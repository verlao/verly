<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Erro no servidor - Verly Vidraçaria</title>
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">
    <link href="css/freelancer.min.css" rel="stylesheet">
    <style>
        .error-container {
            text-align: center;
            padding: 100px 20px;
        }
        .error-code {
            font-size: 120px;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 24px;
            color: #34495e;
            margin-bottom: 30px;
        }
        .home-button {
            display: inline-block;
            padding: 15px 30px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .home-button:hover {
            background-color: #34495e;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">500</div>
        <div class="error-message">Erro no servidor</div>
        <p>Desculpe, ocorreu um erro interno no servidor.</p>
        <p>Nossa equipe técnica já foi notificada e está trabalhando para resolver o problema.</p>
        <p>Por favor, tente novamente mais tarde ou entre em contato conosco pelo WhatsApp.</p>
        <a href="/" class="home-button">Voltar para a página inicial</a>
    </div>
</body>
</html>
